<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spine preview</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #20242b; color: #e8edf4; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    #toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 10px; background: rgba(16,19,24,.94); z-index: 2; }
    #toolbar label { display: inline-flex; align-items: center; gap: 5px; }
    select, input, button { color: inherit; background: #303742; border: 1px solid #596474; border-radius: 4px; padding: 3px 6px; }
    button { cursor: pointer; }
    #status { flex: 1 1 100%; color: #b6c5d8; white-space: pre-wrap; }
    #stage { position: relative; flex: 1; min-height: 0; }
    #canvas { display: block; width: 100%; height: 100%; }
    #atlas { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: center; width: 100%; height: 100%; overflow: auto; padding: 16px; }
    #atlas figure { margin: 0; max-width: min(100%, 1024px); }
    #atlas img { display: block; max-width: 100%; height: auto; image-rendering: auto; }
    #atlas figcaption { padding-top: 4px; color: #b6c5d8; word-break: break-all; }
    #attachments { position: absolute; right: 8px; bottom: 8px; width: min(360px, 42vw); max-height: 34vh; overflow: auto; padding: 8px; margin: 0; background: rgba(16,19,24,.82); border-radius: 5px; color: #c8d6e7; font: 12px ui-monospace, monospace; white-space: pre-wrap; }
    /* The Qt host supplies the controls in the surrounding three-column page.
       Keep the standalone page useful, but remove its chrome when embedded. */
    body.lpk-embedded-host #toolbar,
    body.lpk-embedded-host #attachments { display: none !important; }
    body.lpk-embedded-host #stage { min-height: 0; }
    body.lpk-embedded-host #canvas { transform-origin: center center; }
    .warning { color: #ffd28a; }
    .error { color: #ff9b9b; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="toolbar">
    <label>Skin <select id="skin"></select></label>
    <label>Animation <select id="animation"></select></label>
    <label><input id="pause" type="checkbox"> Pause</label>
    <label><input id="loop" type="checkbox" checked> Loop</label>
    <label>Time <input id="time" type="range" min="0" max="1" step="0.001" value="0" disabled></label>
    <button id="reset" type="button">Reset pose</button>
    <button id="exportPsd" type="button" class="hidden">Export layered PSD</button>
    <span id="status"></span>
  </div>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="atlas" class="hidden"></div>
    <pre id="attachments" class="hidden"></pre>
  </div>
<script>
(function () {
  "use strict";
  const params = new URLSearchParams(window.location.search);
  let manifest;
  let manifestError = null;
  try { manifest = JSON.parse(params.get("manifest") || "{}"); }
  catch (error) { manifest = {}; manifestError = "Invalid Spine preview manifest: " + error; }
  document.body.dataset.previewState = "loading";
  document.body.dataset.previewError = "";

  const status = document.getElementById("status");
  const canvas = document.getElementById("canvas");
  const atlasView = document.getElementById("atlas");
  const attachments = document.getElementById("attachments");
  const skinSelect = document.getElementById("skin");
  const animationSelect = document.getElementById("animation");
  const pauseCheck = document.getElementById("pause");
  const loopCheck = document.getElementById("loop");
  const timeRange = document.getElementById("time");
  const resetButton = document.getElementById("reset");
  const exportPsdButton = document.getElementById("exportPsd");
  if (manifestError) { showError(manifestError); return; }
  let gl, shader, batcher, mvp, renderer, assetManager, runtimeApi;
  let skeleton, state, bounds, atlas;
  let lastFrame = 0;
  let paused = false;
  let loaded = false;
  let firstFrameRendered = false;
  let viewSettings = { opacity: 1, rotation: 0, scale: 1, offsetX: 0, offsetY: 0, transparent: true, background: "#20242b" };
  const MAX_POSE_LAYERS = 64;

  function currentTrack() { return state && state.tracks && state.tracks[0] ? state.tracks[0] : null; }
  function currentAnimationName() {
    const track = currentTrack();
    return track && track.animation ? String(track.animation.name || "") : String(animationSelect.value || "");
  }
  function hostState() {
    const track = currentTrack();
    const animation = track && track.animation;
    const duration = Number(animation && animation.duration || timeRange.max || 0);
    let currentTime = Number(track && track.trackTime || 0);
    if (duration > 0) {
      currentTime = track && track.loop
        ? ((currentTime % duration) + duration) % duration
        : Math.min(Math.max(0, currentTime), duration);
    }
    return {
      mode: String(manifest.mode || ""),
      runtimeLoaded: !!runtimeApi,
      skeletonLoaded: !!skeleton,
      selectedSkin: String(skinSelect.value || ""),
      selectedAnimation: currentAnimationName(),
      paused: !!paused,
      loop: !!(track && track.loop),
      time: currentTime,
      timeMax: duration
    };
  }
  function applyViewSettings() {
    const opacity = Math.max(0.1, Math.min(1, Number(viewSettings.opacity || 1)));
    const scale = Math.max(0.25, Math.min(3, Number(viewSettings.scale || 1)));
    const rotate = Number(viewSettings.rotation || 0);
    const x = Number(viewSettings.offsetX || 0) * 0.5;
    const y = Number(viewSettings.offsetY || 0) * 0.5;
    canvas.style.opacity = String(opacity);
    canvas.style.transform = "translate(" + x + "%," + y + "%) rotate(" + rotate + "deg) scale(" + scale + ")";
    const background = viewSettings.transparent ? "transparent" : String(viewSettings.background || "#20242b");
    document.documentElement.style.background = background;
    document.body.style.background = background;
  }
  function setAnimationByName(name, loop) {
    if (!state || !name) return;
    if (Array.from(animationSelect.options || []).some(function (option) { return option.value === String(name); })) {
      animationSelect.value = String(name);
    }
    const shouldLoop = loop === undefined ? !!loopCheck.checked : !!loop;
    state.setAnimation(0, name, shouldLoop);
    loopCheck.checked = shouldLoop;
    timeRange.value = 0;
  }
  function resetPose() {
    if (!skeleton) return;
    skeleton.setToSetupPose(); skeleton.updateWorldTransform();
    if (state) {
      state.clearTracks();
      if (animationSelect.value) setAnimationByName(animationSelect.value, loopCheck.checked);
    }
    timeRange.value = 0;
    updateAttachmentList();
    try { drawCurrentPose(false); } catch (error) { showError(error); }
  }
  // A tiny, intentionally explicit bridge consumed by SpinePreviewWidget.
  // It is also handy for the standalone diagnostic script without exposing a
  // Qt object to JavaScript.
  window.lpkSpineHost = {
    state: hostState,
    setSkin: function (name) {
      if (!skeleton || !name) return;
      const selected = String(name);
      skeleton.setSkinByName(selected); skinSelect.value = selected;
      skeleton.setSlotsToSetupPose(); updateAttachmentList();
    },
    setAnimation: function (payload) {
      if (typeof payload === "string") payload = {name: payload};
      payload = payload || {};
      setAnimationByName(String(payload.name || ""), payload.loop);
    },
    setPaused: function (value) { paused = !!value; pauseCheck.checked = paused; },
    setLoop: function (value) {
      const checked = !!value; loopCheck.checked = checked;
      const track = currentTrack(); if (track) track.loop = checked;
    },
    setTime: function (value) {
      const track = currentTrack(); if (!track) return;
      const max = Number(track.animation && track.animation.duration || timeRange.max || 0);
      track.trackTime = Math.max(0, Math.min(max, Number(value) || 0));
      state.apply(skeleton); skeleton.updateWorldTransform(); timeRange.value = track.trackTime; drawCurrentPose(false);
    },
    resetPose: resetPose,
    exportPosePsd: function () { return exportPosePsd(); },
    setViewSettings: function (settings) {
      if (!settings) return;
      Object.keys(viewSettings).forEach(function (key) {
        if (settings[key] !== undefined) viewSettings[key] = settings[key];
      });
      applyViewSettings();
    }
  };

  function showError(message) {
    status.className = "error";
    status.textContent = String(message);
    document.body.dataset.previewState = "error";
    document.body.dataset.previewError = String(message);
  }
  function setPreviewState(value, errorMessage) {
    document.body.dataset.previewState = value;
    document.body.dataset.previewError = errorMessage ? String(errorMessage) : "";
  }
  function showWarnings() {
    const warnings = (manifest.warnings || []).filter(Boolean);
    const reason = manifest.reason || "";
    status.className = warnings.length ? "warning" : "";
    status.textContent = [reason].concat(warnings).filter(Boolean).join("\n");
  }
  function basename(url) {
    try { return decodeURIComponent(new URL(url, window.location.href).pathname.split("/").pop()); }
    catch (_) { return String(url).split("/").pop(); }
  }
  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      if (!url) { resolve(); return; }
      const script = document.createElement("script");
      script.src = url;
      script.onload = resolve;
      script.onerror = function () { reject(new Error("Failed to load runtime script: " + url)); };
      document.head.appendChild(script);

  function waitForAssets() {
    return new Promise(function (resolve, reject) {
      const started = Date.now();
      function getAssetErrors() {
        if (!assetManager) return [];
        if (typeof assetManager.hasErrors === "function" && assetManager.hasErrors()) {
          const errors = typeof assetManager.getErrors === "function" ? assetManager.getErrors() : {};
          return Object.keys(errors || {}).map(function (key) { return String(errors[key]); });
        }
        const errors = typeof assetManager.getErrors === "function" ? assetManager.getErrors() : [];
        return Array.isArray(errors) ? errors : Object.keys(errors || {}).map(function (key) { return String(errors[key]); });
      }
      function check() {
        if (assetManager.isLoadingComplete()) {
          const errors = getAssetErrors();
          if (errors.length) {
            reject(new Error(errors.join("\n")));

          return;

        if (Date.now() - started > 60000) { reject(new Error("Timed out while loading Spine atlas textures.")); return; }
        requestAnimationFrame(check);
      }
      check();
    });

  async function fetchSkeleton() {

    if (manifest.skeletonFormat === "binary") return new Uint8Array(await response.arrayBuffer());
    return await response.text();
  }
  function setupSelect(select, values, emptyText) {
    select.innerHTML = "";

      const option = document.createElement("option");
      option.value = value; option.textContent = value; select.appendChild(option);
    });
    if (!(values || []).length) {
      const option = document.createElement("option"); option.textContent = emptyText; select.appendChild(option); select.disabled = true;
    } else select.disabled = false;
  }
  function updateAttachmentList() {
    if (!skeleton || !skeleton.slots) { attachments.classList.add("hidden"); return; }
    const lines = [];
    skeleton.slots.forEach(function (slot) {
      const attachment = slot.getAttachment ? slot.getAttachment() : null;
      lines.push(slot.data.name + ": " + (attachment ? (attachment.name || "<attachment>") : "<none>"));
    });
    attachments.textContent = lines.join("\n");
    attachments.classList.remove("hidden");
  }
  function chooseInitialAnimation(animations) {
    const values = (animations || []).filter(function (item) { return item && item.name; });
    if (!values.length) return "";
    const preferred = values.find(function (item) {
      const name = String(item.name).toLowerCase();
      return name === "normal" || name === "idle";
    });
    if (preferred) return String(preferred.name);
    const substantial = values.find(function (item) {
      return Number(item.duration || 0) > 0.01;
    });
    return String((substantial || values[0]).name);
  }
  function calculateBounds() {
    skeleton.setToSetupPose(); skeleton.updateWorldTransform();
    const offset = new spine.Vector2(), size = new spine.Vector2();
    skeleton.getBounds(offset, size, []);
    return { offset: offset, size: size };
  }
  function fillControls(initialAnimationName) {
    const skins = (skeleton.data.skins || []).map(function (item) { return item.name; });
    const animations = (skeleton.data.animations || []).map(function (item) { return item.name; });
    const previousAnimation = String(animationSelect.value || "");
    setupSelect(skinSelect, skins, "(no skins)");
    setupSelect(animationSelect, animations, "(no animations)");
    if (skins.length) skinSelect.value = skins.indexOf("default") >= 0 ? "default" : skins[0];
    if (animations.length) {
      // Preserve an existing user choice if controls are refreshed later;
      // only the first fill uses the preferred initial track.
      const requested = String(previousAnimation || initialAnimationName || "");
      animationSelect.value = animations.indexOf(requested) >= 0
        ? requested
        : chooseInitialAnimation(skeleton.data.animations || []);
    }
    timeRange.disabled = !animations.length;
    updateAttachmentList();
    skinSelect.onchange = function () { skeleton.setSkinByName(skinSelect.value); skeleton.setSlotsToSetupPose(); updateAttachmentList(); };
    loopCheck.checked = true;
    animationSelect.onchange = function () { setAnimationByName(animationSelect.value, loopCheck.checked); };
    pauseCheck.onchange = function () { paused = pauseCheck.checked; };
    loopCheck.onchange = function () {
      const track = currentTrack(); if (track) track.loop = loopCheck.checked;
    };
    timeRange.oninput = function () {
      const track = state.tracks && state.tracks[0];
      if (track) track.trackTime = Number(timeRange.value);
      state.apply(skeleton); skeleton.updateWorldTransform(); updateAttachmentList();
    };
    resetButton.onclick = resetPose;
    applyViewSettings();
  }
  function renderFrame(now) {
    if (!loaded) return;
    const delta = lastFrame ? Math.min(.1, (now - lastFrame) / 1000) : 0;
    lastFrame = now;
    resize();
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (!paused) state.update(delta);
    state.apply(skeleton); skeleton.updateWorldTransform();
    const track = state.tracks && state.tracks[0];
    if (track && track.animation) {
      timeRange.max = Math.max(.001, track.animation.duration || 0.001);
      const animationTime = typeof track.getAnimationTime === "function"
        ? track.getAnimationTime()
        : (track.loop
          ? (track.trackTime || 0) % Number(timeRange.max)
          : Math.min(track.trackTime || 0, Number(timeRange.max)));
      timeRange.value = Math.min(Number(timeRange.max), Math.max(0, animationTime || 0));
    }
    shader.bind();
    shader.setUniformi(runtimeApi.Shader.SAMPLER, 0);
    shader.setUniform4x4f(runtimeApi.Shader.MVP_MATRIX, mvp.values);
    batcher.begin(shader); renderer.draw(batcher, skeleton); batcher.end(); shader.unbind();
    if (!firstFrameRendered) { firstFrameRendered = true; setPreviewState("ready"); }
    requestAnimationFrame(renderFrame);
  }
  function resize() {
    const width = Math.max(1, canvas.clientWidth), height = Math.max(1, canvas.clientHeight);
    if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
    const centerX = bounds.offset.x + bounds.size.x / 2, centerY = bounds.offset.y + bounds.size.y / 2;
    const scale = Math.max(bounds.size.x / width, bounds.size.y / height) * 1.2;
    mvp.ortho2d(centerX - width * scale / 2, centerY - height * scale / 2, width * scale, height * scale);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  async function startRuntime() {
    if (!manifest.runtime || !manifest.runtime.webgl || !manifest.skeleton || !manifest.atlases || !manifest.atlases.length) {
      throw new Error("Runtime mode requires skeleton, atlas, and matching spine-webgl.js.");
    }
    if (!manifest.runtime.combined) await loadScript(manifest.runtime.core);
    await loadScript(manifest.runtime.webgl);
    if (!window.spine) throw new Error("The supplied runtime did not expose window.spine.");
    runtimeApi = manifest.runtime.api === "flat" ? window.spine : window.spine.webgl;
    if (!runtimeApi || !runtimeApi.AssetManager || !runtimeApi.SkeletonRenderer) {

    }
    gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: false }) || canvas.getContext("experimental-webgl", { alpha: true, premultipliedAlpha: false });
    if (!gl) throw new Error("WebGL is unavailable in this browser.");

    batcher = new runtimeApi.PolygonBatcher(gl);
    mvp = new runtimeApi.Matrix4();
    renderer = new runtimeApi.SkeletonRenderer(gl);
    assetManager = new runtimeApi.AssetManager(gl);
    (manifest.textures || []).forEach(function (url) { assetManager.loadTexture(url); });
    const atlasTexts = await Promise.all(manifest.atlases.map(async function (url) {
      const response = await fetch(url); if (!response.ok) throw new Error("Atlas HTTP " + response.status); return await response.text();
    }));
    await waitForAssets();
    const textureByName = {};
    (manifest.textures || []).forEach(function (url) { textureByName[basename(url)] = assetManager.get(url); });
    const atlasText = atlasTexts.join("\n\n");
    if (manifest.runtime.api === "flat") {
      // Spine 4.0's TextureAtlas constructor parses pages first and textures
      // are attached explicitly.  The 3.8 constructor accepts a texture
      // loader callback, so keep that path for the legacy namespace.
      atlas = new spine.TextureAtlas(atlasText);

        const texture = textureByName[basename(page.name)] || textureByName[page.name];
        if (!texture) throw new Error("Atlas page was not loaded: " + page.name);
        page.setTexture(texture);
      });

      atlas = new spine.TextureAtlas(atlasText, function (name) {
        const texture = textureByName[basename(name)] || textureByName[name];
        if (!texture) throw new Error("Atlas page was not loaded: " + name);
        return texture;

      const binary = new spine.SkeletonBinary(loader); binary.scale = 1; data = binary.readSkeletonData(skeletonPayload);

      try { data = json.readSkeletonData(skeletonPayload); } catch (_) { data = json.readSkeletonData(JSON.parse(skeletonPayload)); }

  function drawCurrentPose(applyState) {

    shader.setUniform4x4f(runtimeApi.Shader.MVP_MATRIX, mvp.values);

  function attachmentKind(attachment) {

  function poseUnsupportedReasons(slot, attachment) {

    if (unsupportedKinds.some(function (value) { return kind.indexOf(value) >= 0; })) {
      reasons.push((slot.data && slot.data.name ? slot.data.name + ":" : "") + (kind || "unsupported attachment"));

      // rasterized with an inaccurate layer appearance.

    if (blendMode !== null && blendMode !== undefined) {

  function visiblePoseSlots() {

  async function exportPosePsd() {

  async function startAtlas() {
    canvas.classList.add("hidden"); atlasView.classList.remove("hidden");

    const imageLoads = (manifest.textures || []).map(function (url) {
      const figure = document.createElement("figure");
      const image = document.createElement("img"); image.alt = basename(url);
