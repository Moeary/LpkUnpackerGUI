name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger when pushing tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download AssetStudioModCLI
      shell: pwsh
      run: |
        $url = "https://github.com/aelurum/AssetStudio/releases/download/v0.19.0/AssetStudioModCLI_net472_win32_64.zip"
        $expectedHash = "cad5b9e2084dda85007012f94c6d3ad1944ba153796c4e80027792d0ba7be285"
        $archive = Join-Path $env:RUNNER_TEMP "AssetStudioModCLI_net472_win32_64.zip"
        $extractRoot = Join-Path $env:RUNNER_TEMP "AssetStudioModCLI"
        $target = Join-Path $PWD "app/tools/AssetStudioCLI"

        Invoke-WebRequest -Uri $url -OutFile $archive
        $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash) {
          throw "AssetStudioModCLI checksum mismatch: $actualHash"
        }

        Expand-Archive -Path $archive -DestinationPath $extractRoot -Force
        $assetStudioExe = Get-ChildItem -Path $extractRoot -Recurse -Filter "AssetStudioModCLI.exe" | Select-Object -First 1
        if (-Not $assetStudioExe) {
          throw "AssetStudioModCLI.exe was not found in the downloaded archive."
        }

        New-Item -ItemType Directory -Path $target -Force | Out-Null
        Copy-Item -Path (Join-Path $assetStudioExe.Directory.FullName "*") -Destination $target -Recurse -Force
        if (-Not (Test-Path (Join-Path $target "AssetStudioModCLI.exe"))) {
          throw "AssetStudioModCLI.exe was not copied into the build tools directory."
        }
    
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        # Keep compatible with pixi.lock format 7 and the local build environment.
        pixi-version: v0.76.2
        cache: true

    - name: Set up MSVC native compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Verify native build toolchain
      shell: pwsh
      run: |
        if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
          throw "CMake is required for native Spine and converter builds."
        }
        cmake --version
        if (-not (Get-Command cl -ErrorAction SilentlyContinue)) {
          throw "The MSVC C++ compiler was not activated by msvc-dev-cmd."
        }

    - name: Set up pinned Live2D MinGW toolchain
      shell: pwsh
      run: |
        $url = "https://github.com/skeeto/w64devkit/releases/download/v1.23.0/w64devkit-1.23.0.zip"
        $expectedHash = "5c7dce6762be3e0dba648a9317790444c0e2f1ef3e677315c115727d7a549539"
        $archive = Join-Path $env:RUNNER_TEMP "w64devkit-1.23.0.zip"
        $extractRoot = Join-Path $env:RUNNER_TEMP "live2d-toolchain"
        Invoke-WebRequest -Uri $url -OutFile $archive
        $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash) {
          throw "w64devkit checksum mismatch: $actualHash"
        }
        Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
        $toolchainBin = Join-Path $extractRoot "w64devkit/bin"
        foreach ($tool in @("gcc", "g++", "gendef", "dlltool", "mingw32-make")) {
          if (-not (Test-Path -LiteralPath (Join-Path $toolchainBin "$tool.exe") -PathType Leaf)) {
            throw "Live2D build tool is missing: $tool"
          }
        }
        $toolchainBin >> $env:GITHUB_PATH

    - name: Cache pinned Spine source archives
      uses: actions/cache@v4
      with:
        path: |
          runtime/tools/spine_native
          runtime/build/native-source-cache
        key: spine-native-${{ hashFiles('app/core/toolchain_manifest.py', 'app/native/spine_bridge/CMakeLists.txt') }}
        restore-keys: |
          spine-native-

    - name: Cache pinned Live2D source archives
      uses: actions/cache@v4
      with:
        # Archives are SHA256-verified by scripts/build_live2d_native.py on every use.
        path: |
          runtime/tools/live2d_native/source/*.zip
          runtime/tools/live2d_native/source/*.tar.gz
        key: live2d-native-source-${{ hashFiles('third_party/live2d_native/SOURCE_METADATA.json') }}

    - name: Cache Nuitka downloads
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\Nuitka
        key: nuitka-cache-windows-${{ hashFiles('pixi.toml', 'pixi.lock') }}
        restore-keys: |
          nuitka-cache-windows-
    
    - name: Build executable with Nuitka
      run: |
        pixi run build
      
    - name: Verify build output
      id: verify
      shell: pwsh
      run: |
        # Onefile EXE at build/, plus the payload it packs kept in build/main.dist.
        $exe = Join-Path $PWD "build/LpkUnpackerGUI.exe"
        $dist = Join-Path $PWD "build/main.dist"
        if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
          throw "Build failed: onefile build/LpkUnpackerGUI.exe not found."
        }
        if (-not (Test-Path -LiteralPath (Join-Path $dist "LpkUnpackerGUI.exe") -PathType Leaf)) {
          throw "Build failed: onefile payload build/main.dist not found."
        }
        if (-not (Test-Path -LiteralPath (Join-Path $dist "tools/AssetStudioCLI/AssetStudioModCLI.exe") -PathType Leaf)) {
          throw "AssetStudioModCLI.exe is missing from the onefile payload."
        }
        echo "EXE_PATH=$exe" >> $env:GITHUB_OUTPUT
        echo "DIST_DIR=$dist" >> $env:GITHUB_OUTPUT
        Write-Host ("Build successful: {0} ({1:N1} MiB)" -f $exe, ((Get-Item $exe).Length / 1MB))

    - name: Verify bundled native artifacts
      shell: pwsh
      run: |
        pixi run python scripts/verify_native_build.py --dist "${{ steps.verify.outputs.DIST_DIR }}" --require-notices
        $dist = "${{ steps.verify.outputs.DIST_DIR }}"
        $bridgeDlls = @(
          (Join-Path $dist "tools/SpineSkeletonDataConverter/lpk_spine_converter.dll"),
          (Join-Path $dist "tools/spine_native/3.8.75/spine_bridge.dll"),
          (Join-Path $dist "tools/spine_native/4.0/spine_bridge.dll")
        ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
        $licenses = @(
          (Join-Path $dist "tools/SpineSkeletonDataConverter/LICENSE"),
          (Join-Path $dist "tools/spine_native/3.8.75/LICENSE"),
          (Join-Path $dist "tools/spine_native/4.0/LICENSE")
        ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
        if ($bridgeDlls.Count -ne 3 -or $licenses.Count -ne 3) {
          throw "Release bundle must contain exactly the three required native DLLs and three licenses."
        }
    
    - name: Package build output
      id: package
      shell: pwsh
      run: |
        if ("${{ github.ref }}" -match '^refs/tags/(.+)$') {
          $version = $matches[1]
        } else {
          $version = "${{ github.sha }}".Substring(0, 7)
        }
        $exeName = "LpkUnpacker-$version-windows-x64.exe"
        Copy-Item -LiteralPath "${{ steps.verify.outputs.EXE_PATH }}" -Destination $exeName
        echo "EXE_NAME=$exeName" >> $env:GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-binary
        path: ${{ steps.package.outputs.EXE_NAME }}

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          runtime/build/
          nuitka-crash-report.xml
          *.log
        if-no-files-found: ignore
        retention-days: 7

  release:
    name: Create Release
    needs: [build_windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-x64-binary

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          LpkUnpacker-*-windows-x64.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

