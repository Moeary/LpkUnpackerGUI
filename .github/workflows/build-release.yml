name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger when pushing tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka ordered-set
    
    - name: Build executable with Nuitka
      run: |
        python -m nuitka --onefile `
          --enable-plugin=pyqt5 `
          --output-dir=build `
          --windows-disable-console `
          --include-data-dir=./Img=Img `
          --include-package=qfluentwidgets `
          --include-package=filetype `
          --windows-icon-from-ico=Img/icon.ico `
          --nofollow-import-to=numpy,matplotlib,scipy,pandas,tkinter `
          --python-flag=no_site `
          --python-flag=no_docstrings `
          --remove-output `
          LpkUnpackerGUI.py
    
    - name: Get version from tag
      id: get_version
      run: |
        $tag = "${{ github.ref }}" -replace 'refs/tags/', ''
        echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
    
    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        release_name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./build/LpkUnpackerGUI.exe
        asset_name: LpkUnpackerGUI-${{ steps.get_version.outputs.VERSION }}.exe
        asset_content_type: application/octet-stream
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Changelog
      run: |
        echo "Release Notes:" > RELEASE_NOTES.txt
        echo "Version: ${{ steps.get_version.outputs.VERSION }}" >> RELEASE_NOTES.txt
        echo "Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" >> RELEASE_NOTES.txt
        echo "" >> RELEASE_NOTES.txt
        echo "Features:" >> RELEASE_NOTES.txt
        echo "- LPK/WPK file extraction" >> RELEASE_NOTES.txt
        echo "- Image extraction with deduplication" >> RELEASE_NOTES.txt
        echo "- Live2D model mod tool" >> RELEASE_NOTES.txt
        echo "- Multi-language support (EN/ZH)" >> RELEASE_NOTES.txt
