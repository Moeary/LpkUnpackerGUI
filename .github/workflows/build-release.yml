name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger when pushing tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download AssetStudioModCLI
      shell: pwsh
      run: |
        $url = "https://github.com/aelurum/AssetStudio/releases/download/v0.19.0/AssetStudioModCLI_net472_win32_64.zip"
        $expectedHash = "cad5b9e2084dda85007012f94c6d3ad1944ba153796c4e80027792d0ba7be285"
        $archive = Join-Path $env:RUNNER_TEMP "AssetStudioModCLI_net472_win32_64.zip"
        $target = Join-Path $PWD "app/tools/AssetStudioCLI"

        Invoke-WebRequest -Uri $url -OutFile $archive
        $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash) {
          throw "AssetStudioModCLI checksum mismatch: $actualHash"
        }

        New-Item -ItemType Directory -Path $target -Force | Out-Null
        Expand-Archive -Path $archive -DestinationPath $target -Force
        if (-Not (Test-Path (Join-Path $target "AssetStudioModCLI.exe"))) {
          throw "AssetStudioModCLI.exe was not found after extraction."
        }
    
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.61.0
        cache: true

    - name: Cache Nuitka downloads
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\Nuitka
        key: nuitka-cache-windows-${{ hashFiles('pixi.toml', 'pixi.lock') }}
        restore-keys: |
          nuitka-cache-windows-
    
    - name: Build executable with Nuitka
      run: |
        pixi run build
      
    - name: Verify build output
      id: verify
      run: |
        $exe = Get-ChildItem -Path "build" -Recurse -Filter "LpkUnpackerGUI.exe" | Select-Object -First 1
        if (-Not $exe) {
          Write-Error "Build failed: LpkUnpackerGUI.exe not found under build/"
          exit 1
        }
        echo "DIST_DIR=$($exe.Directory.FullName)" >> $env:GITHUB_OUTPUT
        Write-Host "Build successful: $($exe.FullName)"
    
    - name: Package build output
      id: package
      run: |
        if ("${{ github.ref }}" -match '^refs/tags/(.+)$') {
          $version = $matches[1]
        } else {
          $version = "${{ github.sha }}".Substring(0, 7)
        }
        $zipName = "LpkUnpacker-$version-windows-x64.zip"
        Compress-Archive -Path "${{ steps.verify.outputs.DIST_DIR }}/*" -DestinationPath $zipName -CompressionLevel Optimal
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-binary
        path: ${{ steps.package.outputs.ZIP_NAME }}

  release:
    name: Create Release
    needs: [build_windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-x64-binary

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          LpkUnpacker-*-windows-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          *.log
        retention-days: 7

